[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
broadcast = "broadcast"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]

# HyperEVM runs the Cancun hardfork without blobs.
solc = "0.8.35"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
deny = "warnings"

# The Merkle vectors shared with packages/attest are read by the tests.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[fuzz]
runs = 512

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
hyperevm = "https://rpc.hyperliquid.xyz/evm"
hyperevm_testnet = "https://rpc.hyperliquid-testnet.xyz/evm"
